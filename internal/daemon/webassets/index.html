<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>evilcode</title>
  <meta name="theme-color" content="{{.ThemeColor}}">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <link rel="icon" href="/assets/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="evilcode">
  <script type="module" src="/assets/js/app.js"></script>
</head>
<body>
  <div id="app" class="app" data-view="home">
    <aside id="sidebar" class="sidebar">
      <header class="brand">
        <span class="brand-glyph" aria-hidden="true">▚</span><span>evilcode</span>
      </header>
      <div id="statusline" class="statusline" role="status" aria-live="polite">connecting…</div>
      <div id="install-hint" class="callout callout--info install-hint" hidden>
        <p class="callout-title">Install</p>
        <p class="install-hint-body">Add this page to your home screen for the standalone app: Share → “Add to Home Screen”.</p>
        <button id="install-hint-dismiss" class="btn btn--small" type="button">Got it</button>
      </div>
      <p class="eyebrow">Sessions</p>
      <nav id="roster" class="roster" aria-label="Sessions"></nav>
      <footer class="sidebar-foot">
        <button id="new-session" class="btn btn--primary" type="button">＋ New session</button>
      </footer>
    </aside>

    <main id="home" class="home">
      <div class="empty">
        <p class="empty-title">No session open</p>
        <p>Pick a session from the roster, or start a new one.</p>
      </div>
    </main>

    <main id="chat" class="chat">
      <div class="chat-backbar">
        <button id="chat-back" class="btn btn--small" type="button" aria-label="Back to the roster">‹ Back</button>
        <span class="backbar-spacer"></span>
        <button id="chat-model" class="btn btn--small" type="button" title="Switch model">Model</button>
        <button id="chat-spawn" class="btn btn--small" type="button">Spawn worker</button>
      </div>
      <header class="chat-head">
        <div class="chat-head-line">
          <h1 id="chat-title" class="chat-title"></h1>
          <div id="chat-actions" class="chat-actions">
            <button id="chat-model-wide" class="btn btn--small" type="button" title="Switch model">Model</button>
            <button id="chat-spawn-wide" class="btn btn--small" type="button">Spawn worker</button>
          </div>
        </div>
        <div id="chat-chips" class="chat-chips"></div>
        <div id="chat-sub" class="chat-sub"></div>
      </header>
      <div id="transcript-scroll" class="chat-scroll">
        <div class="chat-column">
          <div id="transcript" class="transcript"></div>
        </div>
      </div>
      <div id="ask-dock" class="ask-dock" aria-label="Waiting for your answer"></div>
      <form id="composer" class="composer" hidden>
        <div id="composer-attachments" class="composer-attachments" hidden></div>
        <div id="composer-palette" class="palette" hidden></div>
        <div class="composer-row">
          <button id="composer-attach" class="btn btn--small composer-attach" type="button" aria-label="Attach images">＋</button>
          <textarea id="composer-text" class="composer-text" rows="1" placeholder="Message the agent…" aria-label="Message"></textarea>
          <button id="composer-urgent" class="btn btn--small btn--danger" type="button" hidden aria-label="Interrupt urgently">⚡ urgent</button>
          <input id="composer-secret" class="composer-secret" type="password" placeholder="secret" autocomplete="off" hidden aria-label="Command secret">
          <button id="composer-stop" class="btn btn--small btn--danger" type="button" hidden>Stop</button>
          <button id="composer-send" class="btn btn--primary" type="submit">Send</button>
        </div>
        <input id="composer-file" type="file" accept="image/*" multiple hidden>
      </form>
    </main>

    <aside id="rail" class="rail" aria-label="Session details">
      <p class="eyebrow">Session</p>
      <div id="rail-body"></div>
    </aside>

    <div id="sheet-root" class="sheet-root"></div>
  </div>
</body>
</html>
